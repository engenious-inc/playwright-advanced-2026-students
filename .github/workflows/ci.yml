# Deterministic PR gate for the companion repo — NOT the sharded/blob pattern from M16 16.A.
#
# M16 teaches sharding economics (--shard=N/M), blob reporters, and merge-reports for
# unified HTML across parallel jobs (see .github/workflows/sharded-example.yml). This
# workflow stays intentionally simple:
#   - single verify job (profile before you shard)
#   - browser caching (one of 16.A's CI economics beats — implemented here)
#   - Juice Shop up + curl gate (controlled anchor for m06/m14/m15)
#   - live-Tubi specs self-skip or are testIgnore'd in CI (see playwright.config.ts)
#
# When the suite outgrows one job, graduate to a matrix shard + blob upload + merge job:
# see .github/workflows/sharded-example.yml (the runnable 16.A reference, run on demand).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:mcp

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-firefox-webkit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start Juice Shop
        run: docker compose -f docker/juice-shop.docker-compose.yml up -d

      - name: Wait for Juice Shop
        run: |
          ready=0
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 > /dev/null; then
              echo "Juice Shop ready"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Juice Shop did not become ready within 120s"
            docker compose -f docker/juice-shop.docker-compose.yml logs
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
